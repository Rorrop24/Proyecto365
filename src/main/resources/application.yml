server:
  port: 8080

spring:
  application:
    name: pedidos360-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pedidos360_db?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL del emisor de Azure AD / Microsoft Entra ID
          # Formato: https://login.microsoftonline.com/<TU-TENANT-ID>/v2.0
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tu-tenant-id}/v2.0