server:
  port: 8082

spring:
  application:
    name: api-pagos
  datasource:
    url: ${DB_URL:jdbc:mysql://TU_ENDPOINT_DE_AWS:3306/pedidos360}
    username: ${DB_USERNAME:TU_USUARIO_DB}
    password: ${DB_PASSWORD:TU_PASSWORD_DB}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/v2.0}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
